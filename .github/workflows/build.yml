name: Build C Python

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    name: Windows Setup
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install -U pip
          python -m pip install -r requirements-daemon.txt pygame

      - name: Test
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m unittest discover -s tests -v

      - name: Icons
        run: |
          python tools/genera_icone_editor.py
          python tools/genera_logo_icns.py

      - name: Build EXE
        run: python -m PyInstaller --noconfirm --clean installer/Cpython_interpreter_64x_win.spec

      - name: CPython_Setup.exe
        shell: pwsh
        run: |
          Copy-Item -Force dist/Cpython_interpreter_64x_win.exe dist/CPython_Setup.exe
          Get-Item dist/CPython_Setup.exe | Format-List Name, Length
          $info = (Get-Item dist/CPython_Setup.exe).VersionInfo
          $info | Format-List CompanyName, ProductName, ProductVersion, LegalCopyright
          if (-not $info.CompanyName) { throw "Metadati di versione mancanti nell'EXE" }

      - name: SHA256
        shell: pwsh
        run: |
          $h = (Get-FileHash dist/CPython_Setup.exe -Algorithm SHA256).Hash.ToLower()
          "$h  CPython_Setup.exe" | Set-Content dist/CPython_Setup.exe.sha256 -Encoding ascii
          Write-Host "SHA256: $h"

      - name: Upload Setup
        uses: actions/upload-artifact@v4
        with:
          name: CPython_Setup
          path: |
            dist/CPython_Setup.exe
            dist/CPython_Setup.exe.sha256
          if-no-files-found: error

      - name: Upload interpreter EXE
        uses: actions/upload-artifact@v4
        with:
          name: Cpython_interpreter_64x_win
          path: dist/Cpython_interpreter_64x_win.exe
          if-no-files-found: error

  macos:
    name: macOS .app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build .app
        run: bash installer/build_macos.sh

      - name: Upload .app
        uses: actions/upload-artifact@v4
        with:
          name: Cpython_interpreter_macos_app
          path: |
            dist/Cpython_interpreter.app
            dist/Cpython_interpreter_macos.dmg
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: [windows, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Pack
        id: check
        run: |
          mkdir -p out
          cp artifacts/CPython_Setup/CPython_Setup.exe out/
          cp artifacts/CPython_Setup/CPython_Setup.exe.sha256 out/ || true
          cp artifacts/Cpython_interpreter_64x_win/Cpython_interpreter_64x_win.exe out/ || true
          if [ -d artifacts/Cpython_interpreter_macos_app/Cpython_interpreter.app ]; then
            (cd artifacts/Cpython_interpreter_macos_app && zip -r "$GITHUB_WORKSPACE/out/Cpython_interpreter_macos.app.zip" Cpython_interpreter.app)
          fi
          cp artifacts/Cpython_interpreter_macos_app/*.dmg out/ 2>/dev/null || true
          ls -la out
          echo "sha256=$(sha256sum out/CPython_Setup.exe | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
          body: |
            ## Windows
            Scarica **CPython_Setup.exe**, doppio click, installa.

            Poi apri un nuovo terminale:
            ```
            cpy version
            cpy run tuoFile.cpy
            ```

            Interprete nudo (senza installer): `Cpython_interpreter_64x_win.exe`.

            ## macOS
            Scarica **Cpython_interpreter_macos.dmg** (o lo zip `.app`), trascina
            `Cpython_interpreter.app` in Applicazioni, poi al primo avvio se
            Gatekeeper blocca: Impostazioni → Privacy e sicurezza → Apri comunque.

            ## Verifica del file Windows
            SHA256 di `CPython_Setup.exe`:
            ```
            ${{ steps.check.outputs.sha256 }}
            ```
            Controllalo con `Get-FileHash .\CPython_Setup.exe -Algorithm SHA256`.

            ## L'antivirus lo segnala?
            È un falso positivo noto degli eseguibili PyInstaller non firmati.
            Il programma è open source con licenza MIT e la build è pubblica.
            Spiegazione completa, elenco delle modifiche al sistema e istruzioni
            per sbloccarlo o segnalarlo al produttore:
            [ANTIVIRUS.md](https://github.com/andreaaccardo2015-creator/c-python/blob/main/ANTIVIRUS.md)
