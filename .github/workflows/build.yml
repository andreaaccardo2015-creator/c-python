name: Build C Python

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    name: Windows Setup
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install -U pip
          python -m pip install -r requirements-daemon.txt pygame

      - name: Test
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m unittest discover -s tests -v

      - name: Icons
        run: |
          python tools/genera_icone_editor.py
          python tools/genera_logo_icns.py

      - name: Build EXE
        run: python -m PyInstaller --noconfirm --clean installer/Cpython_interpreter_64x_win.spec

      - name: CPython_Setup.exe
        shell: pwsh
        run: |
          Copy-Item -Force dist/Cpython_interpreter_64x_win.exe dist/CPython_Setup.exe
          Get-Item dist/CPython_Setup.exe | Format-List Name, Length
          $info = (Get-Item dist/CPython_Setup.exe).VersionInfo
          $info | Format-List CompanyName, ProductName, ProductVersion, LegalCopyright
          if (-not $info.CompanyName) { throw "Metadati di versione mancanti nell'EXE" }

      - name: SHA256
        shell: pwsh
        run: |
          $h = (Get-FileHash dist/CPython_Setup.exe -Algorithm SHA256).Hash.ToLower()
          "$h  CPython_Setup.exe" | Set-Content dist/CPython_Setup.exe.sha256 -Encoding ascii
          Write-Host "SHA256: $h"

      - name: Upload Setup only
        uses: actions/upload-artifact@v4
        with:
          name: CPython_Setup
          path: |
            dist/CPython_Setup.exe
            dist/CPython_Setup.exe.sha256
          if-no-files-found: error

  release:
    name: GitHub Release (solo Setup)
    needs: [windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: CPython_Setup
          path: out

      - name: Check
        id: check
        run: |
          ls -la out && test -f out/CPython_Setup.exe
          echo "sha256=$(sha256sum out/CPython_Setup.exe | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            out/CPython_Setup.exe
            out/CPython_Setup.exe.sha256
          generate_release_notes: true
          body: |
            ## Windows
            Scarica **CPython_Setup.exe**, doppio click, installa.

            Poi apri un nuovo terminale:
            ```
            cpy version
            cpy run tuoFile.cpy
            ```

            ## Verifica del file
            SHA256 di `CPython_Setup.exe`:
            ```
            ${{ steps.check.outputs.sha256 }}
            ```
            Controllalo con `Get-FileHash .\CPython_Setup.exe -Algorithm SHA256`.

            ## L'antivirus lo segnala?
            È un falso positivo noto degli eseguibili PyInstaller non firmati.
            Il programma è open source con licenza MIT e la build è pubblica.
            Spiegazione completa, elenco delle modifiche al sistema e istruzioni
            per sbloccarlo o segnalarlo al produttore:
            [ANTIVIRUS.md](https://github.com/andreaaccardo2015-creator/c-python/blob/main/ANTIVIRUS.md)
