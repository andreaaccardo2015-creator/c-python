name: Build C Python

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    name: Windows Setup
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install -U pip
          python -m pip install -r requirements-daemon.txt pygame

      - name: Icons
        run: |
          python tools/genera_icone_editor.py
          python tools/genera_logo_icns.py

      - name: Build EXE
        run: python -m PyInstaller --noconfirm --clean installer/Cpython_interpreter_64x_win.spec

      - name: CPython_Setup.exe
        shell: pwsh
        run: |
          Copy-Item -Force dist/Cpython_interpreter_64x_win.exe dist/CPython_Setup.exe
          Get-Item dist/CPython_Setup.exe | Format-List Name, Length

      - name: Upload Setup only
        uses: actions/upload-artifact@v4
        with:
          name: CPython_Setup
          path: dist/CPython_Setup.exe
          if-no-files-found: error

  release:
    name: GitHub Release (solo Setup)
    needs: [windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: CPython_Setup
          path: out

      - name: Check
        run: ls -la out && test -f out/CPython_Setup.exe

      - uses: softprops/action-gh-release@v2
        with:
          files: out/CPython_Setup.exe
          generate_release_notes: true
          body: |
            ## Windows
            Scarica **CPython_Setup.exe**, doppio click, installa.

            Poi apri un nuovo terminale:
            ```
            cpy version
            cpy run tuoFile.cpy
            ```
